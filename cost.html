<!doctype html>
<html>
  <head>
    <title>Sales Computation</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container mt-4">
      <h2 class="mb-4">Sasi Kiran Kodali sales computation</h2>

      <form>
        <div class="mb-3">
          <label for="numberItems" class="form-label">
            Enter number items
          </label>
          <input
            type="number"
            id="numberItems"
            value="1"
            class="form-control"
          />
        </div>

        <div class="mb-3">
          <label for="itemCost" class="form-label">
            Enter the cost of one item
          </label>
          <input
            type="number"
            id="itemCost"
            value="20.0"
            class="form-control"
          />
        </div>

        <div class="mb-3">
          <label for="numberForDiscount" class="form-label">
            Enter number to get discount
          </label>
          <input
            type="number"
            id="numberForDiscount"
            value="10"
            class="form-control"
          />
        </div>

        <div class="mb-3">
          <label for="discountRate" class="form-label">
            Enter the discount rate
          </label>
          <input
            type="number"
            id="discountRate"
            value="0.15"
            class="form-control"
          />
        </div>

        <input
          type="button"
          onclick="doDiscount()"
          value="Show costs"
          class="btn btn-primary"
        />
      </form>

      <div id="result" class="alert alert-secondary mt-3">
        Costs will be displayed here
      </div>

      <hr />

      <h4>Choose Operation</h4>

      <form>
        <div class="form-check">
          <input
            type="radio"
            id="product"
            name="operation"
            value="mul"
            onclick="chooseOp()"
            class="form-check-input"
          />
          <label for="product" class="form-check-label"> product </label>
        </div>

        <div class="form-check">
          <input
            type="radio"
            id="sum"
            name="operation"
            value="add"
            onclick="chooseOp()"
            class="form-check-input"
          />
          <label for="sum" class="form-check-label"> sum </label>
        </div>

        <div class="form-check">
          <input
            type="radio"
            id="divide"
            name="operation"
            value="div"
            onclick="chooseOp()"
            class="form-check-input"
          />
          <label for="divide" class="form-check-label"> divide </label>
        </div>
      </form>

      <div id="operationResult" class="alert alert-info mt-3">
        Operation result will display here
      </div>
    </div>

    <script>
      function doDiscount() {
        let number = Number(document.getElementById("numberItems").value);

        let cost = Number(document.getElementById("itemCost").value);

        let discountAt = Number(
          document.getElementById("numberForDiscount").value,
        );

        let discountRate = Number(
          document.getElementById("discountRate").value,
        );

        let costs = "";

        for (let i = 1; i <= 5; i++) {
          let checkCount = i * number;
          let totalCost;

          if (checkCount <= discountAt) {
            totalCost = checkCount * cost;
          } else {
            totalCost =
              discountAt * cost +
              (checkCount - discountAt) * cost * (1 - discountRate);
          }

          costs += "checkCount " + checkCount + " is " + totalCost + "; ";
        }

        document.getElementById("result").innerHTML = "Costs are: " + costs;
      }

      function chooseOp() {
        let count = Number(document.getElementById("numberItems").value);

        let discountAt = Number(
          document.getElementById("numberForDiscount").value,
        );

        let value;
        let message;

        if (document.getElementById("product").checked) {
          value = count * discountAt;
          message = count + " times " + discountAt + " is " + value;
        } else if (document.getElementById("sum").checked) {
          value = count + discountAt;
          message = count + " plus " + discountAt + " is " + value;
        } else if (document.getElementById("divide").checked) {
          value = count / discountAt;
          message = count + " divided by " + discountAt + " is " + value;
        }

        document.getElementById("operationResult").innerHTML = message;
      }
    </script>
  </body>
</html>
