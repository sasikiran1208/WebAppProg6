<!doctype html>
<html>
  <head>
    <title>Meal Planner</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container mt-4">
      <h2 class="mb-4">Sasi Kiran Kodali meal planner</h2>

      <div class="card p-3 mb-4">
        <h4>Meal Choices</h4>

        <form>
          <div class="form-check">
            <input
              type="checkbox"
              id="breakfast"
              value="True"
              class="form-check-input"
            />
            <label for="breakfast" class="form-check-label"> Breakfast </label>
          </div>

          <div class="form-check">
            <input
              type="checkbox"
              id="lunch"
              value="False"
              class="form-check-input"
            />
            <label for="lunch" class="form-check-label"> Lunch </label>
          </div>

          <div class="form-check mb-3">
            <input
              type="checkbox"
              id="dinner"
              value="True"
              class="form-check-input"
            />
            <label for="dinner" class="form-check-label"> Dinner </label>
          </div>

          <input
            type="button"
            value="Meal Plan Choices"
            onclick="choices()"
            class="btn btn-primary"
          />
        </form>
      </div>

      <div class="card p-3 mb-4">
        <h4>Update Meal Plan</h4>

        <form>
          <div class="mb-3">
            <label for="cuisine" class="form-label"> Enter cuisine type </label>

            <input
              type="text"
              id="cuisine"
              value="Italian"
              class="form-control"
            />
          </div>

          <div class="mb-3">
            <label for="beverage" class="form-label">
              Enter beverage choice
            </label>

            <input
              type="text"
              id="beverage"
              value="water"
              class="form-control"
            />
          </div>

          <input
            type="button"
            value="Update the meal plan"
            onclick="updateMeal()"
            class="btn btn-success"
          />
        </form>
      </div>

      <div id="mealResult" class="alert alert-secondary">
        Meal plan will display here
      </div>
    </div>

    <script>
      let my_meal_plan = {};

      function choices() {
        my_meal_plan = {};

        my_meal_plan.breakfast = document.getElementById("breakfast").checked;

        my_meal_plan.lunch = document.getElementById("lunch").checked;

        my_meal_plan.dinner = document.getElementById("dinner").checked;

        document.getElementById("mealResult").innerHTML =
          JSON.stringify(my_meal_plan);
      }

      function updateMeal() {
        let cuisine = document.getElementById("cuisine").value;

        let beverage = document.getElementById("beverage").value;

        my_meal_plan["cuisine"] = cuisine;
        my_meal_plan["beverage"] = beverage;

        document.getElementById("mealResult").innerHTML =
          JSON.stringify(my_meal_plan);
      }
    </script>
  </body>
</html>
